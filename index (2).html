<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Quiz Website</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="welcome-page">
    <div class="welcome-box">
        <h1>🎓 Welcome to Weekly Quiz</h1>
        <p>Test your web development knowledge week by week.</p>
        <button id="continue-btn">Continue ➜</button>
    </div>
</div>
        <!-- Home Page -->
        <div id="home-page" class="card fade-in">
            <div class="header">
                <i class="fas fa-graduation-cap icon-large"></i>
                <h1>Weekly Quiz Website</h1>
                <p>Test your web development knowledge week by week!</p>
            </div>
            
            <div class="form-group">
                <label for="student-name">Enter Student Name:</label>
                <input type="text" id="student-name" placeholder="Your Full Name" required>
            </div>

            <div class="form-group">
                <label for="week-select">Select Week:</label>
                <select id="week-select">
                    <!-- Options populated by JS -->
                </select>
            </div>

            <button id="start-btn" class="btn btn-primary">Start Quiz <i class="fas fa-play"></i></button>
        </div>

        <!-- Quiz Page -->
        <div id="quiz-page" class="card hidden">
            <div class="quiz-header">
                <div class="user-info">
                    <span id="display-student-name"></span>
                    <span id="display-week"></span>
                </div>
                <div class="timer-container">
                    <div id="timer-circle">
                        <span id="timer-text">30</span>s
                    </div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div id="question-container">
                <h2 id="question-text">Question text goes here?</h2>
                <div id="options-container" class="options-grid">
                    <!-- Options will be injected here -->
                </div>
            </div>

            <div class="quiz-controls">
                <button id="prev-btn" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Previous</button>
                <button id="next-btn" class="btn btn-primary">Next <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <!-- Result Page -->
        <div id="result-page" class="card hidden fade-in">
            <div class="header">
                <i class="fas fa-trophy icon-large gold"></i>
                <h1>Quiz Completed!</h1>
            </div>
            
            <div class="score-display">
                <div class="score-circle">
                    <span id="final-score-text">0/10</span>
                </div>
                <h2 id="percentage-text">0%</h2>
                <p id="pass-fail-message"></p>
            </div>

            <div id="review-section" class="review-container">
                <h3>Review Answers</h3>
                <div id="review-list"></div>
            </div>

            <button id="restart-btn" class="btn btn-primary">Restart Quiz <i class="fas fa-redo"></i></button>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
